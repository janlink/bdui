name: Commit lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          status=0
          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "Merge "* | "Revert "* | "fixup! "* | "squash! "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Non-conventional commit ${sha:0:8}: $subject"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ "$status" -ne 0 ]; then
            echo "Commit subjects must follow Conventional Commits: <type>(<scope>)?!?: <subject>" >&2
          fi
          exit "$status"
